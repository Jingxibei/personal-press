name: Build desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            label: windows-x64
          - os: macos-latest
            target: --mac --arm64 --x64
            label: macos
          - os: ubuntu-latest
            target: --linux --x64
            label: ubuntu-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist -- ${{ matrix.target }}
      - name: Upload unsigned alpha packages for maintainer review
        uses: actions/upload-artifact@v7
        with:
          name: personal-press-${{ matrix.label }}-unsigned-alpha
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
