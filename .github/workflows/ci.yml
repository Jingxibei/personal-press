name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Desktop PDF and IPC smoke test (isolated sample only)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test=/tmp/personal-press-smoke --no-sandbox
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: sample-layout-check
          path: |
            /tmp/personal-press-smoke/sample-print.pdf
            /tmp/personal-press-smoke/sample.epub
            /tmp/personal-press-smoke/reader.png
            /tmp/personal-press-smoke/result.json
          if-no-files-found: error
          retention-days: 7
